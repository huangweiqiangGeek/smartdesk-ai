[project]
name = "smartdesk-ai-service"
version = "0.0.0"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
